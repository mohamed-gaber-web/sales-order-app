<ion-content fullscreen="true" class="login-content">

  <!-- Background layer -->
  <div class="bg-layer">
    <div class="blob blob-orange"></div>
    <div class="blob blob-blue"></div>
  </div>

  <!-- Brand section -->
  <div class="brand-section">
    <div class="brand-logo-wrap">
      <ion-icon name="layers-outline" class="brand-icon"></ion-icon>
    </div>
    <h1 class="brand-name">Grow Path</h1>
    <p class="brand-tagline">Inventory Management Platform</p>
  </div>

  <!-- Login card -->
  <div class="login-card">
    <div class="sheet-handle"></div>

    <div class="card-inner" [formGroup]="form">

      <!-- Card header -->
      <div class="card-head">
        <h2 class="card-title">Welcome back</h2>
        @if (workspaceName) {
          <div class="workspace-chip">
            <ion-icon name="business-outline"></ion-icon>
            <span>{{ workspaceName }}</span>
          </div>
        }
      </div>


      <!-- Email field -->
      <ds-form-field
        [label]="'Email'"
        [required]="true"
        [showError]="(form.get('email')?.invalid && form.get('email')?.touched) ?? false"
        errorMessage="Enter a valid email address.">
        <ion-item lines="none" class="input-item">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input
            formControlName="email"
            type="email"
            placeholder="you@company.com"
            inputmode="email">
          </ion-input>
        </ion-item>
      </ds-form-field>

      <!-- Password field -->
      <ds-form-field
        [label]="'Password'"
        [required]="true"
        [showError]="(form.get('password')?.invalid && form.get('password')?.touched) ?? false"
        errorMessage="Password is required.">
        <ion-item lines="none" class="input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            formControlName="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••">
          </ion-input>
          <ion-button slot="end" fill="clear" (click)="showPassword = !showPassword" type="button">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-item>
      </ds-form-field>

      <!-- Forgot password -->
      <div class="forgot-row">
        <button class="forgot-btn" type="button" (click)="forgotPassword()">Forgot password?</button>
      </div>

      <!-- Error box -->
      @if (errorMessage) {
        <div class="error-box">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <p>{{ errorMessage }}</p>
        </div>
      }

      <!-- Sign In button -->
      <button
        class="signin-btn"
        type="button"
        [disabled]="form.invalid || isLoading"
        (click)="signIn()">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon name="log-in-outline"></ion-icon>
          <span>Sign In</span>
        }
      </button>

    </div>

    <p class="login-footer">Grow Path · Inventory Management Platform</p>
  </div>

</ion-content>
