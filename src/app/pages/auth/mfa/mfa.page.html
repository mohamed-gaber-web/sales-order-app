<ion-content fullscreen="true" class="auth-content">

  <div class="bg-layer">
    <div class="blob blob-orange"></div>
    <div class="blob blob-blue"></div>
  </div>

  <!-- No side menu on these screens, so the language control lives here -->
  <app-language-toggle></app-language-toggle>

  <div class="brand-section">
    <div class="brand-logo-wrap">
      <ion-icon name="shield-checkmark-outline" class="brand-icon"></ion-icon>
    </div>
    <h1 class="brand-name">Grow Path</h1>
    <p class="brand-tagline">{{ 'auth.mfa.tagline' | translate }}</p>
  </div>

  <div class="auth-card">
    <div class="sheet-handle"></div>

    <form class="card-inner" [formGroup]="form" (ngSubmit)="verify()">

      <div class="card-head">
        <h2 class="card-title">{{ 'auth.mfa.title' | translate }}</h2>
      </div>
      <p class="card-sub">
        {{ 'auth.mfa.subtitle' | translate }}
      </p>

      <ds-form-field
        [label]="'auth.mfa.code' | translate"
        [required]="true"
        [showError]="(form.get('code')?.invalid && form.get('code')?.touched) ?? false"
        [errorMessage]="'auth.mfa.codeError' | translate">
        <ion-item lines="none" class="input-item">
          <ion-icon name="keypad-outline" slot="start"></ion-icon>
          <ion-input
            class="code-input"
            formControlName="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="123456"
            enterkeyhint="go">
          </ion-input>
        </ion-item>
      </ds-form-field>

      @if (errorMessage) {
        <div class="error-box" role="alert">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <p>{{ errorMessage }}</p>
        </div>
      }

      <button class="primary-btn" type="submit" [disabled]="form.invalid || isLoading">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon name="checkmark-circle-outline"></ion-icon>
          <span>{{ 'auth.mfa.verify' | translate }}</span>
        }
      </button>

      <div class="link-row link-row-center">
        <button class="link-btn" type="button" routerLink="/auth/login">{{ 'auth.shared.backToSignIn' | translate }}</button>
      </div>

    </form>

    <p class="auth-footer">{{ 'auth.shared.footer' | translate }}</p>
  </div>

</ion-content>
