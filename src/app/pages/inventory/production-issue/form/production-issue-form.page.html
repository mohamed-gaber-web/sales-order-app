<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inventory/production-issue" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Issue Materials</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  <div class="page-body" [formGroup]="form">

    <!-- Order info banner -->
    <div class="order-banner">
      <div class="banner-icon-wrap">
        <ion-icon name="construct-outline"></ion-icon>
      </div>
      <div class="banner-details">
        <p class="banner-label">Production Order</p>
        <p class="banner-value">{{ orderNumber }}</p>
        @if (itemName) {
          <p class="banner-sub">{{ itemName }}</p>
        }
      </div>
      @if (orderedQuantity != null) {
        <ds-stat label="Ordered" [value]="orderedQuantity"></ds-stat>
      }
    </div>

    @if (status) {
      <div class="status-row">
        <span class="status-label">Status</span>
        <ds-pill [label]="status" [color]="getStatusColor(status)" [bg]="getStatusBg(status)"></ds-pill>
      </div>
    }

    <!-- Item Number -->
    <ds-form-field label="Item Number" [required]="true"
      [showError]="(form.get('itemNumber')?.invalid && form.get('itemNumber')?.touched) ?? false"
      errorMessage="Item number is required.">
      <ion-item lines="none" class="input-item">
        <ion-icon name="cube-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="itemNumber" placeholder="Scan or enter item number" inputmode="text" clearInput="true"></ion-input>
      </ion-item>
    </ds-form-field>

    <!-- Issue Quantity -->
    <ds-form-field label="Issue Quantity" [required]="true"
      [showError]="(form.get('issueQty')?.invalid && form.get('issueQty')?.touched) ?? false"
      errorMessage="Enter a quantity greater than 0.">
      <ion-item lines="none" class="input-item">
        <ion-icon name="layers-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="issueQty" type="number" inputmode="decimal" placeholder="0.00" min="0.001"></ion-input>
      </ion-item>
    </ds-form-field>

    <!-- Warehouse -->
    <ds-form-field label="Warehouse" [required]="true"
      [showError]="(form.get('warehouseId')?.invalid && form.get('warehouseId')?.touched) ?? false"
      errorMessage="Warehouse is required.">
      <ion-item lines="none" class="input-item">
        <ion-icon name="business-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="warehouseId" placeholder="e.g. 11" inputmode="text" clearInput="true"></ion-input>
      </ion-item>
    </ds-form-field>

    <!-- Batch ID (optional) -->
    <ds-form-field label="Batch ID" [optional]="true">
      <ion-item lines="none" class="input-item">
        <ion-icon name="barcode-outline" slot="start" color="medium"></ion-icon>
        <ion-input formControlName="batchId" placeholder="Scan or enter batch number" inputmode="text" clearInput="true"></ion-input>
      </ion-item>
    </ds-form-field>

    <div class="info-box">
      <ion-icon name="information-circle-outline" color="primary"></ion-icon>
      <p>Materials will be deducted from the selected warehouse and posted against production order <strong>{{ orderNumber }}</strong>. Verify quantities before submitting.</p>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ds-cta-bar
    label="Post Issue"
    icon="checkmark-circle-outline"
    [loading]="isSubmitting"
    [disabled]="form.invalid"
    (ctaClick)="submitIssue()">
  </ds-cta-bar>
</ion-footer>
