<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Sale Label</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" aria-label="Close">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="label-preview-content">
  @if (renderFailed()) {
    <div class="label-preview-error">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <p>This device can't render the label preview. Open the order in D365 to print it instead.</p>
    </div>
  } @else {
    <div class="label-preview-wrap">
      <img
        [src]="previewSrc()"
        class="label-preview-img"
        alt="Sale label preview for order {{ sale.orderNumber }}" />
    </div>
  }
</ion-content>

<ion-footer class="ion-no-border">
  <div class="label-preview-actions">
    <ion-button expand="block" class="share-btn" [disabled]="isBusy() || renderFailed()" (click)="share()">
      @if (isBusy()) {
        <ion-spinner name="crescent" slot="start"></ion-spinner>
      } @else {
        <ion-icon slot="start" name="print-outline"></ion-icon>
      }
      Share / Print
    </ion-button>
    <ion-button
      expand="block"
      fill="outline"
      class="download-btn"
      [disabled]="isBusy() || renderFailed()"
      (click)="download()">
      <ion-icon slot="start" name="download-outline"></ion-icon>
      Download
    </ion-button>
  </div>
</ion-footer>
